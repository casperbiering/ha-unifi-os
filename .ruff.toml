# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "ARG001", # unused args on Home Assistant callback signatures
    "ARG002",
    "CPY001", # HA integrations do not ship per-file copyright headers
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "EM101", # exception messages from string literals
    "ISC001", # incompatible with formatter
    "N818", # HA error class names do not always end with Error
    "PLR0913", # Home Assistant helpers often take many parameters
    "TC001", # PEP 649 lazy annotations; do not force TYPE_CHECKING blocks
    "TC002",
    "TC003",
    "TRY003", # long exception messages
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
"tests/**" = [
    "S101", # asserts are expected in tests
    "SLF001",
]
"tests/conftest.py" = [
    "S101",
    "SLF001",
    "E402", # pytest_plugins must be assigned before path surgery
]
